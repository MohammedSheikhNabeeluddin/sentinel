<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Live Shield</title>
<style>
:root{--bg:#0b1220;--card:#111827;--border:#1f2937;--txt:#e5e7eb;--mut:#9ca3af;--grn:#10b981;--red:#ef4444;--blu:#0d6efd}
*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.top a{color:var(--mut);text-decoration:none;font-size:13px;margin-right:14px}
.top a.on{color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.big{font-size:28px;font-weight:800}.lab{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.ok{background:var(--grn)}.bad{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:600}
td{padding:6px 8px;border-bottom:1px solid #151d2e;font-family:monospace}
.deny{color:var(--red);font-weight:700}.allow{color:var(--grn)}
h2{font-size:15px;margin:20px 0 8px}.mut{color:var(--mut);font-size:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;border:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span style="font-weight:800">🛡️ Sentinel</span>
    <a href="/">Check</a><a href="/risk">Overview</a><a href="/findings">Problems</a><a href="/plan">Planner</a><a href="/live" class="on">Live</a>
    <span class="mut" style="margin-left:auto" id="upd">loading…</span>
  </div>
  <h2 style="margin-top:4px">Live Shield — Juice Shop behind the guard <span class="mut">(auto-refresh 10s)</span></h2>
  <div class="grid" id="kpis"></div>
  <h2>Latest round</h2>
  <div class="card" id="round">—</div>
  <h2>Recent guard decisions</h2>
  <div class="card"><table><thead><tr><th>time</th><th>verdict</th><th>method</th><th>path</th><th>guard</th></tr></thead><tbody id="dec"></tbody></table></div>
  <h2>Recent rounds</h2>
  <div class="card"><table><thead><tr><th>#</th><th>time</th><th>proved vs guard</th></tr></thead><tbody id="rnd"></tbody></table></div>
</div>
<script>
async function tick(){
  try{
    const j = await (await fetch('/api/live/summary',{cache:'no-store'})).json();
    const dot = on => `<span class="dot ${on?'ok':'bad'}"></span>`;
    document.getElementById('kpis').innerHTML =
      kpi('Guard :8080', dot(j.guard_up)+(j.guard_up?'UP — filtering':'DOWN')) +
      kpi('Shop :3000', dot(j.shop_up)+(j.shop_up?'UP':'DOWN')) +
      kpi('Blocked', `<span style="color:var(--red)">${j.blocked}</span>`) +
      kpi('Allowed', `<span style="color:var(--grn)">${j.allowed}</span>`) +
      kpi('Top guard', Object.entries(j.by_guard).sort((a,b)=>b[1]-a[1]).map(e=>`${e[0]} ×${e[1]}`).join('<br>') || '—');
    const r = j.last_round;
    document.getElementById('round').innerHTML = r
      ? `Round <b>#${r.round}</b> · ${r.proved}/${r.total} attacks proved vs shop · policy denied ${r.denied} <span class="mut">${r.ts||''}</span>`
      : 'No rounds yet — loop starts on its 5-minute tick.';
    document.getElementById('dec').innerHTML = j.recent_decisions.map(d=>
      `<tr><td>${(d.ts||'').slice(11,19)}</td><td class="${d.decision}">${d.decision.toUpperCase()}</td><td>${d.method||''}</td><td>${(d.path||'').slice(0,70)}</td><td>${d.guard||''}</td></tr>`).join('') || '<tr><td colspan=5>No decisions yet</td></tr>';
    document.getElementById('rnd').innerHTML = j.recent_rounds.map(x=>
      `<tr><td>#${x.round}</td><td>${(x.ts||'').slice(0,19).replace('T',' ')}</td><td>${x.proved}/${x.total} proved</td></tr>`).join('') || '<tr><td colspan=3>—</td></tr>';
    document.getElementById('upd').textContent = 'updated ' + new Date().toLocaleTimeString();
  }catch(e){ document.getElementById('upd').textContent = 'backend unreachable'; }
}
function kpi(l,v){ return `<div class="card"><div class="lab">${l}</div><div class="big" style="font-size:20px">${v}</div></div>`; }
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
