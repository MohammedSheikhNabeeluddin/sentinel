# One-service deploy: FastAPI serves the Sentinel UI (/) plus all /api/* routes.
# Render dashboard -> New -> Blueprint -> pick this repo. Then set NVIDIA_API_KEY below.
services:
  - type: web
    name: sentinel
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_ENDPOINT
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
